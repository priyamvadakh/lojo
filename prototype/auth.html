<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lojo</title>
<link rel="icon" type="image/png" href="assets/lojo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- ASSUMPTION: login and onboarding sit outside the app shell, so they have no sidebar. check with Eric -->
<script>
  (function () {
    var pref = 'system';
    try { pref = localStorage.getItem('lojo-theme') || 'system'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme-pref', pref);
  })();
</script>
<style>
  :root{
    --rose:#E85D75;
    --peach:#FFB199;
    --brand-gradient:linear-gradient(135deg,#E85D75,#FFB199);
    --ink:#241A14;
    --bg:#FFFFFF;
    --bg-soft:#F5F3F0;
    --panel:#FFFFFF;
    --line:rgba(36,26,20,.08);
    --line-2:rgba(36,26,20,.16);
    --muted:#6E5A4E;
    --success:#3F8F5F;
    --warning:#D99A2B;
    --error:#C64545;
    --info:#3E6FA6;
    --display:"Outfit",system-ui,sans-serif;
    --body:"Manrope",system-ui,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{font-size:15px}
  body{margin:0;min-height:100vh;background-color:#fff;background-image:radial-gradient(rgba(36,26,20,.07) 1px,transparent 1.3px);background-size:22px 22px;background-position:-11px -11px;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--rose);text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  button{font:inherit}
  [hidden]{display:none!important}

  .shell{display:grid;grid-template-columns:1fr;min-height:100vh}

  /* brand panel */
  .brand{
    position:relative;overflow:hidden;
    background:var(--ink);color:#F6EEE6;
    padding:40px 56px;display:flex;flex-direction:column;
  }
  .brand::after{
    content:"";position:absolute;right:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(232,93,117,.28),rgba(232,93,117,0) 68%);pointer-events:none;
  }
  .logo{display:inline-flex;align-items:center;gap:11px;color:inherit;text-decoration:none}
  .logo:hover{text-decoration:none}
  .logo img{width:36px;height:36px;border-radius:22%;display:block}
  .logo span{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:-.03em}
  .brand h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,3.4vw,3rem);line-height:1.04;letter-spacing:-.03em;margin:auto 0 18px;max-width:13ch}
  .brand h1 em{font-style:normal;background:var(--brand-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .brand .sub{color:rgba(246,238,230,.72);max-width:40ch;font-size:1rem}
  .label{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
  .firstrun{margin:34px 0 auto;padding:0;list-style:none;display:grid;gap:12px;max-width:46ch;counter-reset:s}
  .firstrun li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;color:rgba(246,238,230,.86);font-size:.93rem;counter-increment:s}
  .firstrun li::before{
    content:counter(s,decimal-leading-zero);font-family:var(--display);font-weight:700;font-size:.78rem;
    width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
    background:rgba(246,238,230,.08);color:var(--peach);
  }
  .firstrun + .label{margin-top:34px}
  .brand .fine{margin-top:32px;font-size:.8rem;color:rgba(246,238,230,.45)}

  /* form side */
  .side{display:flex;flex-direction:column;padding:28px 40px}
  .side__top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
  .side__top a{color:var(--muted);font-weight:500}
  .side__top a.logo--top{color:var(--ink);font-weight:700;transition:opacity .15s ease}
  .side__top a.logo--top:hover{opacity:.8;text-decoration:none}
  .logo--top img{width:34px;height:34px}
  .logo--top span{font-size:1.45rem}
  .card{
    width:min(460px,100%);margin:auto;position:relative;top:-6vh;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:40px 40px 34px;box-shadow:0 30px 60px -44px rgba(36,26,20,.4);
  }
  .card h2{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:-.02em;margin:0 0 2px;text-align:center}
  .card .lead{color:var(--muted);margin:4px 0 28px;text-align:center}

  .sso{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    height:44px;padding:0 18px;border-radius:999px;cursor:pointer;
    font-weight:600;font-size:.95rem;text-decoration:none;
    transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,opacity .15s;
  }
  .btn:hover{text-decoration:none}
  .btn--sso{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line-2)}
  .btn--sso:hover{background:var(--panel);border-color:rgba(36,26,20,.28);box-shadow:0 6px 16px -12px rgba(36,26,20,.5)}
  .btn--sso svg{width:20px;height:20px;flex:none}
  .btn--primary{width:100%;background:var(--ink);color:var(--panel);border:1px solid var(--ink)}
  .btn--primary:hover{box-shadow:0 10px 24px -14px rgba(36,26,20,.8)}
  .btn[disabled]{opacity:.6;cursor:progress}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;display:none}
  .btn.is-loading .spin{display:inline-block}
  .btn.is-loading .ico{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  #form:not([hidden]){animation:formIn .25s ease}
  @keyframes formIn{from{opacity:0;transform:translateY(-6px)}}
  .or{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.04em}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-2)}

  form{display:grid;gap:12px}
  .field{display:grid;gap:6px}
  .field__row{display:flex;justify-content:space-between;align-items:baseline}
  .field label{font-weight:600;font-size:.88rem}
  .field__row a{font-size:.84rem}
  .input{position:relative}
  .input input{
    width:100%;height:44px;padding:0 14px;border-radius:12px;
    border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font:inherit;font-size:.95rem;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .input input::placeholder{color:#a8998f}
  .input input:hover{border-color:rgba(36,26,20,.28)}
  .input input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(232,93,117,.16)}
  .input--pw input{padding-right:64px}
  .reveal{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:none;color:var(--muted);font-size:.8rem;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer;
  }
  .reveal:hover{background:rgba(36,26,20,.05);color:var(--ink)}
  .field.has-error input{border-color:var(--error)}
  .field.has-error input:focus{box-shadow:0 0 0 3px rgba(198,69,69,.14)}
  .err{display:none;color:var(--error);font-size:.82rem;font-weight:500}
  .field.has-error .err{display:block}
  .hint{color:var(--muted);font-size:.8rem}
  .field--name{display:none}
  .card.is-signup .field--name{display:grid}
  .card.is-signup .forgot{display:none}

  .alert{display:none;border-radius:12px;padding:12px 14px;font-size:.88rem}
  .alert.show{display:block}
  .alert--error{background:rgba(198,69,69,.08);border:1px solid rgba(198,69,69,.25);color:var(--error)}
  .alert--ok{background:rgba(63,143,95,.08);border:1px solid rgba(63,143,95,.28);color:var(--success)}

  .switch{margin:26px 0 0;text-align:center;color:var(--muted);font-size:.9rem}
  .switch button{border:0;background:none;color:var(--rose);font-weight:600;cursor:pointer;padding:0}
  .switch button:hover{text-decoration:underline}
  .legal{margin:0;padding:8px 16px 4px;text-align:center;color:var(--muted);font-size:.8rem}
  .legal a{color:var(--muted);text-decoration:underline;font-weight:500}
  .demo{margin:14px auto auto;background:var(--panel);width:min(440px,100%);text-align:center;font-size:.78rem;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px;padding:8px 12px}

  :focus-visible{outline:2px solid var(--rose);outline-offset:2px}

  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .brand{padding:28px 24px}
    .brand h1{margin-top:28px}
    .firstrun,.firstrun + .label,.brand .fine{display:none}
    .side{padding:20px 16px 32px}
    .card{padding:28px 20px 22px;margin:28px auto auto;top:0}
    .card .help{margin:20px -20px -22px;padding:14px 20px}
    .sso{gap:10px}
    .btn--sso{padding:0 12px}
    .legal{padding:20px 8px 4px;font-size:.74rem}
  }

  .theme-toggle{position:relative;display:inline-flex;align-items:center;justify-content:space-between;width:58px;height:30px;padding:0 7px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-soft);color:var(--muted);cursor:pointer;flex:none}
  .theme-toggle svg{position:relative;z-index:1;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:color .2s ease}
  .theme-toggle::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .theme-toggle .t-sun{color:#C98A2E}
  :root[data-theme="dark"] .theme-toggle::before{transform:translateX(28px);background:#4A3A31}
  :root[data-theme="dark"] .theme-toggle .t-sun{color:var(--muted)}
  :root[data-theme="dark"] .theme-toggle .t-moon{color:#F2EBE5}

  :root[data-theme="dark"]{
    --ink:#F2EBE5; --bg:#15100D; --bg-soft:#231B16; --panel:#1C1612;
    --line:rgba(255,236,222,.08); --line-2:rgba(255,236,222,.16); --muted:#B3A398; --cream:#F6EEE6;
    --amber-soft:#3B2F1A; --success:#6BC08F; --error:#EC7B7B; --info:#86AEDD;
    color-scheme:dark;
  }
  :root[data-theme="dark"] body{background-color:#120E0B;background-image:radial-gradient(rgba(255,236,222,.06) 1px,transparent 1.3px)}
  :root[data-theme="dark"] a:where(:not(.nav-item):not(.btn):not(.also):not(.tile):not(.pop__row):not(.logo):not(.stat)){color:#F29BAA}
  :root[data-theme="dark"] .btn--grad{color:#15100D}
  :root[data-theme="dark"] .btn--primary kbd{background:rgba(21,16,13,.1);border-color:rgba(21,16,13,.3);color:#15100D}
  :root[data-theme="dark"] .btn--primary,:root[data-theme="dark"] .chip[aria-pressed="true"],:root[data-theme="dark"] .toast{color:#15100D}
  :root[data-theme="dark"] .btn--secondary:hover{background:var(--bg-soft)}
  :root[data-theme="dark"] .btn--danger{background:transparent}
  :root[data-theme="dark"] .text{background:var(--bg-soft);color:var(--ink)}
  :root[data-theme="dark"] .text::placeholder{color:#7F7068}
  :root[data-theme="dark"] .badge--rose{background:rgba(232,93,117,.18);color:#F29BAA}
  :root[data-theme="dark"] .badge--amber{color:#E3C27A}
  :root[data-theme="dark"] .badge--muted{background:rgba(255,236,222,.08)}

  :root[data-theme="dark"] .card{box-shadow:0 30px 60px -44px rgba(0,0,0,.9)}
  :root[data-theme="dark"] .input input{background:var(--bg-soft);color:var(--ink)}
  :root[data-theme="dark"] .btn--sso:hover{background:var(--bg-soft)}
  :root[data-theme="dark"] .alert--ok{background:rgba(107,192,143,.1)}
  .side__top{gap:16px}
  .side__top .theme-toggle{margin-left:auto}
  .help{margin:18px -40px -34px;padding:14px 40px;border-top:1px solid var(--line);text-align:center;font-size:.82rem;color:var(--muted);border-radius:0 0 16px 16px;background:var(--bg-soft)}

  .card .ico-c{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin:0 auto 16px;background:rgba(232,93,117,.1);color:#B73C54}
  .card .ico-c svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .card .ico-c.is-warn{background:rgba(217,154,43,.14);color:#94660F}
  .card .ico-c.is-err{background:rgba(198,69,69,.1);color:var(--error)}
  .card .ico-c.is-ok{background:rgba(63,143,95,.12);color:var(--success)}
  .card .ico-c.is-logo{background:none;width:64px;height:64px}
  .card .ico-c.is-logo img{width:64px;height:64px;border-radius:22%;animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(.92);opacity:.8}}
  .stack{display:grid;gap:12px}
  .row-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .row-btns .btn{flex:1 1 160px}
  .back{display:block;text-align:center;margin-top:18px;font-size:.88rem}
  .who{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;font-size:.88rem;margin-bottom:14px}
  .who .av{width:30px;height:30px;border-radius:9px;background:var(--brand-gradient);color:#fff;font-weight:800;font-size:.72rem;display:grid;place-items:center}
  .who b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who button{border:0;background:none;color:#B73C54;font-weight:600;cursor:pointer;font-size:.84rem}
  .rules{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
  .rules li::before{content:"○";display:inline-block;width:18px;font-weight:700}
  .rules li.ok{color:var(--success)}
  .rules li.ok::before{content:"✓"}
  .regions{display:grid;gap:10px}
  .region{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;padding:14px 16px;border:1px solid var(--line-2);border-radius:14px;cursor:pointer;text-align:left;background:var(--panel)}
  .region:hover{border-color:rgba(36,26,20,.3)}
  .region:has(input:checked){border-color:var(--rose);box-shadow:0 0 0 3px rgba(232,93,117,.14)}
  .region input{margin:3px 0 0;accent-color:var(--rose);width:16px;height:16px}
  .region b{display:block;font-size:.92rem}
  .region span{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
  .check{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);cursor:pointer}
  .check input{accent-color:var(--rose)}
  .steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-size:.88rem}
  .steps li{display:flex;gap:10px;align-items:center;color:var(--muted)}
  .steps li i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);flex:none;font-style:normal;font-size:.64rem;display:grid;place-items:center}
  .steps li.done{color:var(--ink)}
  .steps li.done i{background:var(--success);border-color:var(--success);color:#fff}
  .steps li.now i{border-color:var(--rose);border-right-color:transparent;animation:spin .8s linear infinite}
  .ref{display:block;text-align:center;margin-top:14px;font-size:.74rem;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
  .code404{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;text-align:center;background:var(--brand-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
  .card h2,.card .lead{text-align:center}
</style>
</head>
<body>
<div class="shell">

  <main class="side">
    <div class="side__top">
      <a class="logo logo--top" href="../index.html" aria-label="Go to the lojo website" title="Go to lojo.ai"><img src="assets/lojo-icon.png" alt="" width="34" height="34"><span>lojo</span></a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Dark mode"><svg class="t-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><svg class="t-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg></button>
    </div>

    <section class="card" id="card" aria-live="polite"></section>
    <p class="legal">By logging in, you acknowledge that you have read and understood, and agree to lojo’s <a href="#">Terms &amp; Conditions</a> &amp; <a href="#">Privacy Policy</a>.</p>
  </main>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const P = new URLSearchParams(location.search);
  let user = { name: 'Sara', email: 'sara@nimbuspay.com' };
  try { const u = JSON.parse(sessionStorage.getItem('lojo-user')); if (u && u.email) user = u; } catch (e) {}
  const email = P.get('email') || user.email;
  const I = {
    mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    key: '<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7M17 6l2 2M15 8l2 2"/></svg>',
    user: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
    clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    alert: '<svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    cloud: '<svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/><path d="m4 4 16 16"/></svg>',
    lock: '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  };
  const ref = () => 'Reference ' + Math.random().toString(36).slice(2, 8).toUpperCase();
  const icon = (k, cls) => '<div class="ico-c ' + (cls || '') + '">' + I[k] + '</div>';
  const back = '<a class="back" href="login.html">← Back to sign in</a>';
  const go = (s, extra) => { location.href = 'auth.html?s=' + s + (extra || ''); };
  const SCREENS = {
    // G26
    forgot: () => ({ title: 'Reset your password', html: icon('key') + '<h2>Reset your password</h2><p class="lead">Enter your work email and we’ll send you a link to set a new password.</p>' +
      '<form id="f" class="stack" novalidate><div class="field" id="fe"><label for="em">Work email</label><div class="input"><input id="em" type="email" autocomplete="email" value="' + esc(P.get('email') || '') + '" placeholder="sara@nimbuspay.com"></div><span class="err">Enter a valid email, like sara@nimbuspay.com.</span></div>' +
      '<button class="btn btn--primary" type="submit"><span class="spin"></span><span class="txt">Send reset link</span></button></form>' + back,
      init: () => { $('em').focus(); $('f').onsubmit = (e) => { e.preventDefault(); const v = $('em').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { $('fe').classList.add('has-error'); $('em').focus(); return; }
        const b = e.submitter || $('f').querySelector('button'); b.classList.add('is-loading'); b.disabled = true;
        setTimeout(() => go('sent', '&email=' + encodeURIComponent(v)), 800); }; } }),
    sent: () => ({ title: 'Check your email', html: icon('mail', 'is-ok') + '<h2>Check your email</h2><p class="lead">If <b>' + esc(email) + '</b> has a lojo account, a link to set a new password is on its way. It works once, for 30 minutes.</p>' +
      '<div class="row-btns"><button class="btn btn--secondary" id="resend" type="button">Resend link</button><a class="btn btn--primary" href="auth.html?s=set&from=reset">Open the link (demo)</a></div>' + back,
      init: () => { const r = $('resend'); r.onclick = () => { let n = 30; r.disabled = true; const t = setInterval(() => { r.textContent = 'Resend in ' + n-- + 's'; if (n < 0) { clearInterval(t); r.disabled = false; r.textContent = 'Resend link'; } }, 1000); }; } }),
    // G27
    set: () => { const invite = P.get('from') === 'invite';
      return { title: invite ? 'Join Nimbus Pay' : 'Set a new password', html: icon(invite ? 'user' : 'key') +
        '<h2>' + (invite ? 'Join Nimbus Pay on lojo' : 'Set a new password') + '</h2><p class="lead">' + (invite ? 'Lena Okafor invited you. Set a password to finish creating your account.' : 'Choose a new password for your lojo account.') + '</p>' +
        '<div class="who"><span class="av">' + esc(email[0].toUpperCase()) + '</span><b>' + esc(email) + '</b></div>' +
        '<form id="f" class="stack" novalidate><div class="field"><label for="p1">New password</label><div class="input input--pw"><input id="p1" type="password" autocomplete="new-password"><button class="reveal" type="button" id="rv">Show</button></div>' +
        '<ul class="rules" id="rules"><li data-r="len">At least 8 characters</li><li data-r="num">At least one number</li><li data-r="match">Both passwords match</li></ul></div>' +
        '<div class="field"><label for="p2">Type it again</label><div class="input"><input id="p2" type="password" autocomplete="new-password"></div></div>' +
        '<button class="btn btn--primary" type="submit" id="sb" disabled><span class="spin"></span><span class="txt">' + (invite ? 'Join workspace' : 'Set password') + '</span></button></form>' + back,
        init: () => { const chk = () => { const a = $('p1').value, b = $('p2').value, r = { len: a.length >= 8, num: /\d/.test(a), match: a.length > 0 && a === b };
            document.querySelectorAll('#rules li').forEach(li => li.classList.toggle('ok', r[li.dataset.r])); $('sb').disabled = !(r.len && r.num && r.match); };
          ['p1', 'p2'].forEach(id => $(id).addEventListener('input', chk)); $('p1').focus();
          $('rv').onclick = () => { const s = $('p1').type === 'password'; $('p1').type = $('p2').type = s ? 'text' : 'password'; $('rv').textContent = s ? 'Hide' : 'Show'; };
          $('f').onsubmit = (e) => { e.preventDefault(); $('sb').classList.add('is-loading'); setTimeout(() => go('loading', invite ? '&next=dashboard.html' : ''), 700); }; } }; },
    // G24
    details: () => ({ title: 'Your details', html: icon('user') + '<h2>Your details</h2><p class="lead">First time here. Add your last name so your team can see who approved what.</p>' +
      '<form id="f" class="stack" novalidate><div class="field"><label for="fn">First name</label><div class="input"><input id="fn" value="' + esc(user.name.split(' ')[0] || '') + '" autocomplete="given-name"></div></div>' +
      '<div class="field" id="fl"><label for="ln">Last name</label><div class="input"><input id="ln" autocomplete="family-name" placeholder="Lindqvist"></div><span class="err">Add your last name to continue.</span></div>' +
      '<p class="hint" style="margin:0">' + esc(user.via || 'Microsoft') + ' didn’t share your last name. You can change both later.</p>' +
      '<button class="btn btn--primary" type="submit"><span class="spin"></span><span class="txt">Continue</span></button></form>',
      init: () => { $('ln').focus(); $('f').onsubmit = (e) => { e.preventDefault(); const ln = $('ln').value.trim();
        if (!ln) { $('fl').classList.add('has-error'); $('ln').focus(); return; }
        user.name = ($('fn').value.trim() + ' ' + ln).trim(); try { sessionStorage.setItem('lojo-user', JSON.stringify(user)); } catch (err) {}
        go('loading'); }; } }),
    // G28
    expired: () => ({ title: 'Link expired', html: icon('clock', 'is-warn') + '<h2>This link has expired</h2><p class="lead">Links in lojo emails work once, for 30 minutes. Ask for a new one and use the newest email.</p>' +
      '<div class="row-btns"><a class="btn btn--primary" href="auth.html?s=forgot">Send a new link</a></div>' + back }),
    error: () => ({ title: 'Couldn’t sign in', html: icon('alert', 'is-err') + '<h2>We couldn’t sign you in</h2><p class="lead">Something went wrong on our side. Nothing was lost. Try again; if it keeps happening, email hello@lojo.ai with the reference below.</p>' +
      '<div class="row-btns"><a class="btn btn--primary" href="login.html">Try again</a></div><span class="ref">' + ref() + '</span>' }),
    notice: () => ({ title: 'Signed out', html: icon('info') + '<h2>You’ve been signed out</h2><p class="lead">For your security, lojo signs you out after 12 hours. Sign in again to pick up where you left off.</p>' +
      '<div class="row-btns"><a class="btn btn--primary" href="login.html">Sign in again</a></div>' }),
    // G15
    region: () => ({ title: 'Choose a region', html: icon('globe') + '<h2>Choose a region</h2><p class="lead">' + esc(email) + ' belongs to workspaces in more than one region. Your data stays in the region you pick.</p>' +
      '<form id="f" class="stack"><div class="regions">' +
      '<label class="region"><input type="radio" name="rg" value="eu" checked><div><b>Europe · Frankfurt</b><span>Nimbus Pay · Nimbus Pay — Sandbox</span></div></label>' +
      '<label class="region"><input type="radio" name="rg" value="us"><div><b>United States · Virginia</b><span>Nimbus Pay US</span></div></label>' +
      '<label class="region"><input type="radio" name="rg" value="none"><div><b>Asia Pacific · Singapore</b><span>No workspaces yet</span></div></label></div>' +
      '<label class="check"><input type="checkbox" checked> Remember my choice on this device</label>' +
      '<button class="btn btn--primary" type="submit"><span class="spin"></span><span class="txt">Continue</span></button></form>' + back,
      init: () => { $('f').onsubmit = (e) => { e.preventDefault(); const v = $('f').rg.value;
        go(v === 'us' ? 'unreachable' : v === 'none' ? 'noaccess' : 'loading', '&region=' + v); }; } }),
    unreachable: () => ({ title: 'Can’t reach the region', html: icon('cloud', 'is-warn') + '<h2>We can’t reach United States · Virginia</h2><p class="lead">Your workspaces and data there are safe. The region isn’t answering right now; this usually clears in a few minutes.</p>' +
      '<div class="row-btns"><button class="btn btn--primary" id="retry" type="button"><span class="spin"></span><span class="txt">Try again</span></button><a class="btn btn--secondary" href="auth.html?s=region">Choose another region</a></div>' + back,
      init: () => { $('retry').onclick = () => { $('retry').classList.add('is-loading'); setTimeout(() => go('loading'), 1400); }; } }),
    noaccess: () => ({ title: 'No access', html: icon('lock', 'is-err') + '<h2>No access in this region</h2><p class="lead">' + esc(email) + ' isn’t a member of any workspace in Asia Pacific · Singapore. Ask a workspace Owner to invite you, or choose another region.</p>' +
      '<div class="row-btns"><a class="btn btn--primary" href="auth.html?s=region">Choose another region</a></div>' + back }),
    // G16
    loading: () => ({ title: 'Signing in…', html: '<div class="ico-c is-logo"><img src="assets/lojo-icon.png" alt=""></div><h2>Signing you in…</h2><p class="lead">This takes a few seconds.</p>' +
      '<ul class="steps" id="st"><li>Checking your account</li><li>Opening your workspace</li><li>Loading your loop</li></ul>',
      init: () => { const li = [...document.querySelectorAll('#st li')]; li.forEach(l => l.insertAdjacentHTML('afterbegin', '<i></i>'));
        let i = 0; const tick = () => { li.forEach((l, n) => { l.className = n < i ? 'done' : n === i ? 'now' : ''; if (n < i) l.querySelector('i').textContent = '✓'; });
          if (i++ < li.length) setTimeout(tick, 650); else setTimeout(() => location.href = P.get('next') || 'onboarding.html', 400); }; tick(); } }),
    failed: () => ({ title: 'lojo couldn’t start', html: icon('alert', 'is-err') + '<h2>lojo couldn’t start</h2><p class="lead">The app didn’t finish loading. This is often a blocked script or a dropped connection. Reload the page; if it keeps happening, try another browser.</p>' +
      '<div class="row-btns"><button class="btn btn--primary" type="button" onclick="location.href=\'auth.html?s=loading\'">Reload</button><a class="btn btn--secondary" href="login.html">Back to sign in</a></div><span class="ref">Error APP_START_TIMEOUT · ' + ref() + '</span>' }),
    // G12
    '404': () => ({ title: 'Page not found', html: '<div class="code404">404</div><h2>Page not found</h2><p class="lead">This page isn’t here. The link may be wrong, or the page has moved.</p><div class="row-btns"><a class="btn btn--primary" href="dashboard.html">Go to the dashboard</a></div>' }),
    '403': () => ({ title: 'No access', html: '<div class="code404">403</div><h2>You don’t have access to this page</h2><p class="lead">You’re signed in as ' + esc(email) + '. Ask a workspace Owner to give you access, or switch account.</p><div class="row-btns"><a class="btn btn--primary" href="dashboard.html">Go to the dashboard</a><a class="btn btn--secondary" href="login.html">Switch account</a></div>' }),
    '500': () => ({ title: 'Something went wrong', html: '<div class="code404">500</div><h2>Something went wrong</h2><p class="lead">That’s on us, not you. Your work is saved. Try again in a moment.</p><div class="row-btns"><button class="btn btn--primary" type="button" onclick="location.reload()">Try again</button><a class="btn btn--secondary" href="dashboard.html">Go to the dashboard</a></div><span class="ref">' + ref() + '</span>' }),
  };
  const s = SCREENS[P.get('s')] ? P.get('s') : '404';
  const scr = SCREENS[s]();
  document.title = scr.title + ' · lojo';
  $('card').innerHTML = scr.html;
  if (scr.init) scr.init();
  document.addEventListener('input', (e) => { const f = e.target.closest('.field'); if (f) f.classList.remove('has-error'); });
</script>
<script>
(function themeToggle() {
  const root = document.documentElement;
  const sync = () => {
    const dark = root.getAttribute('data-theme') === 'dark';
    document.querySelectorAll('[data-theme-toggle]').forEach(b => { b.setAttribute('aria-pressed', dark); b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); b.title = dark ? 'Light mode' : 'Dark mode'; });
  };
  sync();
  document.addEventListener('click', (e) => {
    if (!e.target.closest('[data-theme-toggle]')) return;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('lojo-theme', next); } catch (err) {}
    sync();
  });
})();
</script>
</body>
